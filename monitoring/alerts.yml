groups:
  - name: student-api
    rules:
      - alert: StudentApiDown
        expr: up{job="student-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: Student API is unavailable}
      - alert: HighErrorRate
        expr: rate(flask_http_request_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: Elevated 5xx error rate}

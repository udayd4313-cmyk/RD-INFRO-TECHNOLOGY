- name: Install Kubernetes tools
  ansible.builtin.apt:
    name: [apt-transport-https, kubelet, kubeadm, kubectl]
    state: present
    update_cache: true
- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-api
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: flake8 app tests main.py
      - run: pytest -q
  image:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - uses: docker/metadata-action@v5
        id: meta
        with: {images: ${{ env.IMAGE }}, tags: type=sha}
      - uses: docker/build-push-action@v6
        with: {context: ., file: docker/Dockerfile, push: true, tags: ${{ steps.meta.outputs.tags }}, labels: ${{ steps.meta.outputs.labels }} }
      - uses: aquasecurity/trivy-action@0.32.0
        with: {image-ref: '${{ steps.meta.outputs.tags }}', format: table, exit-code: '1', ignore-unfixed: true, severity: CRITICAL,HIGH}
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
      - name: Deploy with rolling update
        env: {KUBECONFIG: kubeconfig}
        run: |
          kubectl apply -k kubernetes
          kubectl -n student-api set image deployment/student-api api=${{ env.IMAGE }}:sha-${GITHUB_SHA::7}
          kubectl -n student-api rollout status deployment/student-api --timeout=180s
      - name: Roll back on failure
        if: failure()
        env: {KUBECONFIG: kubeconfig}
        run: kubectl -n student-api rollout undo deployment/student-api
      - name: Slack notification
        if: always() && secrets.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v2.1.1
        with: {webhook: '${{ secrets.SLACK_WEBHOOK }}', webhook-type: incoming-webhook, payload: '{"text":"Student API deployment ${{ job.status }}"}'}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-api
  namespace: student-api
  labels: {app: student-api}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: student-api}}
  template:
    metadata: {labels: {app: student-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: api
          image: your-dockerhub-user/student-api:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 5000}]
          envFrom:
            - configMapRef: {name: student-api-config}
            - secretRef: {name: student-api-secrets, optional: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /api/v1/health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
      volumes: [{name: data, persistentVolumeClaim: {claimName: student-data}}]
